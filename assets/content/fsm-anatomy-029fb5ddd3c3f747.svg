<svg xmlns="http://www.w3.org/2000/svg" width="900" height="384" viewBox="0 0 900 384"><title>Anatomy of a state machine on the robot battery example: initial state, active state, states, events and transitions</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><path d="M452.7,108.9 Q510.0,86.0 565.4,108.2" fill="none" stroke="#002b47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="509.5" y="82.3" font-size="12.5" text-anchor="middle" fill="#002b47" font-style="italic">battery &lt; 20 %</text><path d="M606.2,171.8 Q600.0,246.0 545.9,294.1" fill="none" stroke="#002b47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="598.7" y="248.9" font-size="12.5" text-anchor="start" fill="#002b47" font-style="italic">at dock</text><path d="M475.6,295.4 Q420.0,246.0 414.0,173.8" fill="none" stroke="#002b47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="421.7" y="249.7" font-size="12.5" text-anchor="end" fill="#002b47" font-style="italic">battery full</text><circle cx="410.0" cy="46.0" r="7.0" fill="#002b47"/><path d="M410,54 L410,76" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><circle cx="410.0" cy="126.0" r="53.0" fill="none" stroke="#97c600" stroke-width="5" opacity="0.8"/><circle cx="410.0" cy="126.0" r="46.0" fill="#eff6dc" stroke="#5d8a00" stroke-width="3"/><text x="410.0" y="122.1" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Scout</text><text x="410.0" y="140.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">rows</text><circle cx="610.0" cy="126.0" r="46.0" fill="#ffffff" stroke="#002b47" stroke-width="2.2"/><text x="610.0" y="122.1" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Return</text><text x="610.0" y="140.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">to dock</text><circle cx="510.0" cy="326.0" r="46.0" fill="#ffffff" stroke="#002b47" stroke-width="2.2"/><text x="510.0" y="331.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Charge</text><rect x="10.0" y="16.0" width="214.0" height="52.0" rx="10" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="24.0" y="36.0" font-size="11" text-anchor="start" fill="#002b47" font-weight="bold" letter-spacing="0.08em">INITIAL STATE</text><text x="24.0" y="56.0" font-size="12" text-anchor="start" fill="#002b47">where the machine starts</text><path d="M224,40 L410.0,46.0" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="410.0" cy="46.0" r="4.0" fill="#002b47"/><rect x="10.0" y="136.0" width="214.0" height="52.0" rx="10" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="24.0" y="156.0" font-size="11" text-anchor="start" fill="#5d8a00" font-weight="bold" letter-spacing="0.08em">ACTIVE STATE</text><text x="24.0" y="176.0" font-size="12" text-anchor="start" fill="#002b47">exactly one at a time</text><path d="M224,160 L358.0,142.0" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="358.0" cy="142.0" r="4.0" fill="#5d8a00"/><rect x="10.0" y="286.0" width="214.0" height="52.0" rx="10" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="24.0" y="306.0" font-size="11" text-anchor="start" fill="#002b47" font-weight="bold" letter-spacing="0.08em">STATE</text><text x="24.0" y="326.0" font-size="12" text-anchor="start" fill="#002b47">runs one behaviour</text><path d="M224,310 L464.0,326.0" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="464.0" cy="326.0" r="4.0" fill="#002b47"/><rect x="676.0" y="16.0" width="214.0" height="52.0" rx="10" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="690.0" y="36.0" font-size="11" text-anchor="start" fill="#002b47" font-weight="bold" letter-spacing="0.08em">EVENT</text><text x="690.0" y="56.0" font-size="12" text-anchor="start" fill="#002b47">something changes</text><path d="M676,40 L569.5,78.3" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="569.5" cy="78.3" r="4.0" fill="#002b47"/><rect x="676.0" y="206.0" width="214.0" height="52.0" rx="10" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="690.0" y="226.0" font-size="11" text-anchor="start" fill="#2f86b3" font-weight="bold" letter-spacing="0.08em">TRANSITION</text><text x="690.0" y="246.0" font-size="12" text-anchor="start" fill="#002b47">event → next state</text><path d="M676,230 L588.0,239.5" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="588.0" cy="239.5" r="4.0" fill="#2f86b3"/></g></svg>
