<svg xmlns="http://www.w3.org/2000/svg" width="900" height="314" viewBox="0 0 900 314"><title>The FSM control loop: read the sensors, check the events of the current state, switch state if an event fired, run the state's behaviour, repeat</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><rect x="25.0" y="152.0" width="150.0" height="56.0" rx="10" fill="#e4f2f9" stroke="#2f86b3" stroke-width="1.5"/><text x="100.0" y="176.4" font-size="13" text-anchor="middle" fill="#002b47" font-weight="bold">read the</text><text x="100.0" y="193.0" font-size="13" text-anchor="middle" fill="#002b47" font-weight="bold">sensors</text><rect x="215.0" y="152.0" width="170.0" height="56.0" rx="10" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="300.0" y="176.4" font-size="13" text-anchor="middle" fill="#002b47" font-weight="bold">check the events of</text><text x="300.0" y="193.0" font-size="13" text-anchor="middle" fill="#002b47" font-weight="bold">the current state</text><path d="M480,136 L526,180 L480,224 L434,180 Z" fill="#fbe7bd" stroke="#d98e04" stroke-width="2"/><text x="480.0" y="176.6" font-size="12" text-anchor="middle" fill="#002b47" font-weight="bold">event</text><text x="480.0" y="192.0" font-size="12" text-anchor="middle" fill="#002b47" font-weight="bold">fired?</text><rect x="555.0" y="52.0" width="190.0" height="56.0" rx="10" fill="#fbe7bd" stroke="#d98e04" stroke-width="1.5"/><text x="650.0" y="76.4" font-size="13" text-anchor="middle" fill="#002b47" font-weight="bold">switch state,</text><text x="650.0" y="93.0" font-size="13" text-anchor="middle" fill="#002b47" font-weight="bold">set up on entry</text><rect x="720.0" y="152.0" width="160.0" height="56.0" rx="10" fill="#eff6dc" stroke="#5d8a00" stroke-width="1.5"/><text x="800.0" y="176.4" font-size="13" text-anchor="middle" fill="#002b47" font-weight="bold">run the state's</text><text x="800.0" y="193.0" font-size="13" text-anchor="middle" fill="#002b47" font-weight="bold">behaviour</text><path d="M176,180 L213,180" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M386,180 L432,180" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M527,180 L718,180" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="600.0" y="172.0" font-size="12" text-anchor="middle" fill="#002b47" font-style="italic">no</text><path d="M480,135 L480,80 L553,80" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="488.0" y="112.0" font-size="12" text-anchor="start" fill="#002b47" font-style="italic">yes</text><path d="M746,80 L800,80 L800,150" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M800,209 L800,262 L100,262 L100,210" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="381.2" y="254.6" width="137.6" height="16.2" rx="3" fill="#ffffff"/><text x="450.0" y="266.0" font-size="12" text-anchor="middle" fill="#002b47" font-style="italic">next control cycle</text><rect x="180.0" y="22.0" width="240.0" height="66.0" rx="10" fill="#e8edf1" stroke="#002b47" stroke-width="1.5"/><text x="196.0" y="42.0" font-size="10" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">CURRENT STATE</text><rect x="196.0" y="52.0" width="208.0" height="26.0" rx="13" fill="#fbe7bd" stroke="#d98e04" stroke-width="1.5"/><text x="300.0" y="70.0" font-size="12" text-anchor="middle" fill="#002b47" font-weight="bold">Navigate through row</text><path d="M300,89 L300,150" fill="none" stroke="#a9b7c0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-faint)" stroke-dasharray="4 3"/><text x="308.0" y="128.0" font-size="11" text-anchor="start" fill="#5f7482" font-style="italic">reads</text><path d="M553,66 L422,58" fill="none" stroke="#d98e04" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-amber)" stroke-dasharray="4 3"/><text x="490.0" y="52.0" font-size="11" text-anchor="middle" fill="#8a5a00" font-style="italic">writes</text><text x="450.0" y="304.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">one state at a time · events first, then act · set up on entry · test each state on its own</text></g></svg>
