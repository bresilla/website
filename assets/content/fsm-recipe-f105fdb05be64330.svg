<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><title>Five steps to build a state machine: behaviours to states, events to transitions, draw the diagram, write the table, code the loop and test</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><path d="M40,40 L40,360" fill="none" stroke="#a9b7c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40.0" cy="40.0" r="22.0" fill="#5d8a00"/><text x="40.0" y="46.0" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text><text x="78.0" y="37.0" font-size="15" text-anchor="start" fill="#002b47" font-weight="bold">Behaviours → states</text><text x="78.0" y="57.0" font-size="12" text-anchor="start" fill="#5f7482" font-style="italic">one state per behaviour</text><circle cx="40.0" cy="120.0" r="22.0" fill="#d98e04"/><text x="40.0" y="126.0" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text><text x="78.0" y="117.0" font-size="15" text-anchor="start" fill="#002b47" font-weight="bold">Events → transitions</text><text x="78.0" y="137.0" font-size="12" text-anchor="start" fill="#5f7482" font-style="italic">what ends each behaviour?</text><circle cx="40.0" cy="200.0" r="22.0" fill="#2f86b3"/><text x="40.0" y="206.0" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text><text x="78.0" y="197.0" font-size="15" text-anchor="start" fill="#002b47" font-weight="bold">Draw the diagram</text><text x="78.0" y="217.0" font-size="12" text-anchor="start" fill="#5f7482" font-style="italic">circles and arrows first</text><circle cx="40.0" cy="280.0" r="22.0" fill="#004d00"/><text x="40.0" y="286.0" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text><text x="78.0" y="277.0" font-size="15" text-anchor="start" fill="#002b47" font-weight="bold">Write the table</text><text x="78.0" y="297.0" font-size="12" text-anchor="start" fill="#5f7482" font-style="italic">every arrow is one row</text><circle cx="40.0" cy="360.0" r="22.0" fill="#002b47"/><text x="40.0" y="366.0" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text><text x="78.0" y="357.0" font-size="15" text-anchor="start" fill="#002b47" font-weight="bold">Code the loop, then test</text><text x="78.0" y="377.0" font-size="12" text-anchor="start" fill="#5f7482" font-style="italic">one state at a time</text></g></svg>
