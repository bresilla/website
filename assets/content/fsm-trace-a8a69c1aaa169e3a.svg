<svg xmlns="http://www.w3.org/2000/svg" width="900" height="278" viewBox="0 0 900 278"><title>A CropScout run over time: the active state switches from move to start, to navigate row, to headland turn and back, only when an event fires</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><text x="20.0" y="96.0" font-size="13" text-anchor="start" fill="#002b47" font-weight="bold">active state</text><text x="20.0" y="176.0" font-size="13" text-anchor="start" fill="#002b47" font-weight="bold">robot</text><rect x="150.0" y="72.0" width="41.8" height="40.0" rx="6" fill="#97c600"/><rect x="193.8" y="72.0" width="260.8" height="40.0" rx="6" fill="#d98e04"/><text x="325.2" y="97.0" font-size="12" text-anchor="middle" fill="#002b47" font-weight="bold">Navigate row</text><rect x="456.6" y="72.0" width="114.8" height="40.0" rx="6" fill="#2f86b3"/><text x="515.0" y="97.0" font-size="12" text-anchor="middle" fill="#fbf6e5" font-weight="bold">Headland turn</text><rect x="573.4" y="72.0" width="27.2" height="40.0" rx="6" fill="#97c600"/><rect x="602.6" y="72.0" width="260.8" height="40.0" rx="6" fill="#d98e04"/><text x="734.0" y="97.0" font-size="12" text-anchor="middle" fill="#002b47" font-weight="bold">Navigate row</text><rect x="865.4" y="72.0" width="12.6" height="40.0" rx="6" fill="#2f86b3"/><path d="M192.8,60 L192.8,124" fill="none" stroke="#002b47" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="192.8" y="54.0" font-size="11" text-anchor="middle" fill="#002b47" font-style="italic">at start</text><path d="M455.59999999999997,44 L455.59999999999997,124" fill="none" stroke="#002b47" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="455.6" y="38.0" font-size="11" text-anchor="middle" fill="#002b47" font-style="italic">at end</text><path d="M572.4,60 L572.4,124" fill="none" stroke="#002b47" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="572.4" y="54.0" font-size="11" text-anchor="middle" fill="#002b47" font-style="italic">≥ 180°</text><path d="M601.6,44 L601.6,124" fill="none" stroke="#002b47" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="601.6" y="38.0" font-size="11" text-anchor="middle" fill="#002b47" font-style="italic">at start</text><path d="M864.4,60 L864.4,124" fill="none" stroke="#002b47" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="864.4" y="54.0" font-size="11" text-anchor="middle" fill="#002b47" font-style="italic">at end</text><rect x="150.0" y="156.0" width="41.8" height="30.0" rx="6" fill="#e8edf1"/><rect x="193.8" y="156.0" width="260.8" height="30.0" rx="6" fill="#e8edf1"/><text x="325.2" y="176.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">driving row 1</text><rect x="456.6" y="156.0" width="114.8" height="30.0" rx="6" fill="#e8edf1"/><text x="515.0" y="176.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">turning</text><rect x="573.4" y="156.0" width="27.2" height="30.0" rx="6" fill="#e8edf1"/><rect x="602.6" y="156.0" width="260.8" height="30.0" rx="6" fill="#e8edf1"/><text x="734.0" y="176.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">driving row 2</text><rect x="865.4" y="156.0" width="12.6" height="30.0" rx="6" fill="#e8edf1"/><text x="150.0" y="214.0" font-size="11" text-anchor="middle" fill="#5f7482">0 s</text><text x="296.0" y="214.0" font-size="11" text-anchor="middle" fill="#5f7482">20 s</text><text x="442.0" y="214.0" font-size="11" text-anchor="middle" fill="#5f7482">40 s</text><text x="588.0" y="214.0" font-size="11" text-anchor="middle" fill="#5f7482">60 s</text><text x="734.0" y="214.0" font-size="11" text-anchor="middle" fill="#5f7482">80 s</text><text x="880.0" y="214.0" font-size="11" text-anchor="middle" fill="#5f7482">100 s</text><path d="M150.0,198 L880.0,198" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="330.0" y="228.0" width="22.0" height="12.0" rx="6" fill="#97c600"/><text x="358.0" y="239.0" font-size="11" text-anchor="start" fill="#002b47">Move to start</text><rect x="480.0" y="228.0" width="22.0" height="12.0" rx="6" fill="#d98e04"/><text x="508.0" y="239.0" font-size="11" text-anchor="start" fill="#002b47">Navigate row</text><rect x="630.0" y="228.0" width="22.0" height="12.0" rx="6" fill="#2f86b3"/><text x="658.0" y="239.0" font-size="11" text-anchor="start" fill="#002b47">Headland turn</text><text x="515.0" y="266.0" font-size="13" text-anchor="middle" fill="#002b47" font-style="italic">At every moment exactly one state is active. Only an event can switch it.</text></g></svg>
