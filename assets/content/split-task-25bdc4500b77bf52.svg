 font-size="13" text-anchor="middle" fill="#002b47" font-weight="bold">Follow path</text><rect x="515.0" y="226.0" width="170.0" height="40.0" rx="8" fill="#ffffff" stroke="#5d8a00" stroke-width="1.5"/><text x="600.0" y="250.7" font-size="13" text-anchor="middle" fill="#002b47" font-weight="bold">Avoid obstacles</text><rect x="355.0" y="284.0" width="190.0" height="40.0" rx="8" fill="#ffffff" stroke="#5d8a00" stroke-width="1.5"/><text x="450.0" y="308.7" font-size="13" text-anchor="middle" fill="#002b47" font-weight="bold">Coordinate motion</text><path d="M330,266 L400,282" fill="none" stroke="#5d8a00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-lime)"/><path d="M570,266 L500,282" fill="none" stroke="#5d8a00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-lime)"/><path d="M545,304 L606,304" fill="none" stroke="#002b47" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="614.0" y="308.0" font-size="12" text-anchor="start" fill="#002b47">left &amp; right motor</text></g></svg>
