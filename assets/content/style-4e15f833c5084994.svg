<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Three communication styles with timelines. Publish-subscribe: the sender sends messages at its own rate and nobody waits. Call and wait: the caller is blocked while the planner thinks. Shared memory: the battery writes the latest value into a store and the executive reads the newest value when it wants</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><rect x="1.0" y="1.0" width="288.0" height="358.0" rx="14" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="145.0" y="30.0" font-size="16" text-anchor="middle" fill="#002b47" font-weight="bold">Publish–subscribe</text><text x="145.0" y="50.0" font-size="11.5" text-anchor="middle" fill="#5f7482" font-style="italic">send and move on</text><text x="145.0" y="344.0" font-size="11.5" text-anchor="middle" fill="#002b47" font-weight="bold">good for: sensor streams</text><path d="M18,196 L272,196" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-faint)"/><text x="18.0" y="187.0" font-size="10.5" text-anchor="start" fill="#5f7482">sender</text><path d="M18,266 L272,266" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-faint)"/><text x="18.0" y="257.0" font-size="10.5" text-anchor="start" fill="#5f7482">receiver</text><text x="272.0" y="290.0" font-size="10" text-anchor="end" fill="#a9b7c0" font-style="italic">time</text><rect x="306.0" y="1.0" width="288.0" height="358.0" rx="14" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="450.0" y="30.0" font-size="16" text-anchor="middle" fill="#002b47" font-weight="bold">Call and wait</text><text x="450.0" y="50.0" font-size="11.5" text-anchor="middle" fill="#5f7482" font-style="italic">ask, then wait for the answer</text><text x="450.0" y="344.0" font-size="11.5" text-anchor="middle" fill="#002b47" font-weight="bold">good for: one question, one answer</text><path d="M323,196 L577,196" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-faint)"/><text x="323.0" y="187.0" font-size="10.5" text-anchor="start" fill="#5f7482">sender</text><path d="M323,266 L577,266" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-faint)"/><text x="323.0" y="257.0" font-size="10.5" text-anchor="start" fill="#5f7482">receiver</text><text x="577.0" y="290.0" font-size="10" text-anchor="end" fill="#a9b7c0" font-style="italic">time</text><rect x="611.0" y="1.0" width="288.0" height="358.0" rx="14" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="755.0" y="30.0" font-size="16" text-anchor="middle" fill="#002b47" font-weight="bold">Shared memory</text><text x="755.0" y="50.0" font-size="11.5" text-anchor="middle" fill="#5f7482" font-style="italic">write the latest, read any time</text><text x="755.0" y="344.0" font-size="11.5" text-anchor="middle" fill="#002b47" font-weight="bold">good for: current state, like battery</text><path d="M628,196 L882,196" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-faint)"/><text x="628.0" y="187.0" font-size="10.5" text-anchor="start" fill="#5f7482">sender</text><path d="M628,266 L882,266" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-faint)"/><text x="628.0" y="257.0" font-size="10.5" text-anchor="start" fill="#5f7482">receiver</text><text x="882.0" y="290.0" font-size="10" text-anchor="end" fill="#a9b7c0" font-style="italic">time</text><rect x="21.0" y="85.0" width="74.0" height="30.0" rx="9" fill="#88c9e4" stroke="#2f86b3" stroke-width="2"/><text x="58.0" y="104.0" font-size="11" text-anchor="middle" fill="#002b47" font-weight="bold" letter-spacing="0.05em">GPS</text><rect x="112.0" y="88.0" width="76.0" height="24.0" rx="12" fill="#e4f2f9" stroke="#2f86b3" stroke-width="1.5"/><text x="150.0" y="103.8" font-size="10.5" text-anchor="middle" fill="#002b47">position</text><rect x="198.0" y="72.0" width="84.0" height="24.0" rx="8" fill="#ffffff" stroke="#00