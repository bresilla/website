6b3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sky)" stroke-dasharray="3 3"/><text x="145.0" y="316.0" font-size="12" text-anchor="middle" fill="#5d8a00" font-weight="bold" font-style="italic">nobody waits</text><rect x="323.0" y="85.0" width="104.0" height="30.0" rx="8" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="375.0" y="104.1" font-size="11.5" text-anchor="middle" fill="#002b47" font-weight="bold">Follow path</text><rect x="477.0" y="85.0" width="100.0" height="30.0" rx="9" fill="#004d00" stroke="#004d00" stroke-width="2"/><text x="527.0" y="104.0" font-size="11" text-anchor="middle" fill="#fbf6e5" font-weight="bold" letter-spacing="0.05em">Planner</text><path d="M428,92 L475,92" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M475,108 L430,108" fill="none" stroke="#004d00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-green)"/><rect x="357.0" y="189.0" width="168.0" height="14.0" rx="4" fill="#f6d6d3" stroke="#b3261e" stroke-width="1.2"/><text x="441.0" y="200.0" font-size="10" text-anchor="middle" fill="#b3261e" font-weight="bold">blocked</text><rect x="381.0" y="259.0" width="124.0" height="14.0" rx="4" fill="#e3eedf" stroke="#004d00" stroke-width="1.2"/><text x="443.0" y="270.0" font-size="10" text-anchor="middle" fill="#004d00" font-weight="bold">thinking</text><path d="M357,204 L379,256" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M507,256 L525,206" fill="none" stroke="#004d00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-green)"/><text x="345.0" y="236.0" font-size="10" text-anchor="start" fill="#002b47" font-style="italic">request</text><text x="521.0" y="236.0" font-size="10" text-anchor="start" fill="#004d00" font-style="italic">reply</text><text x="450.0" y="316.0" font-size="12" text-anchor="middle" fill="#b3261e" font-weight="bold" font-style="italic">the caller waits</text><rect x="622.0" y="85.0" width="80.0" height="30.0" rx="8" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="662.0" y="104.1" font-size="11.5" text-anchor="middle" fill="#002b47" font-weight="bold">Battery</text><rect x="714.0" y="84.0" width="84.0" height="32.0" rx="6" fill="#002b47"/><text x="756.0" y="105.0" font-size="13" text-anchor="middle" fill="#fbf6e5" font-weight="bold">64 %</text><rect x="808.0" y="85.0" width="84.0" height="30.0" rx="8" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="850.0" y="104.1" font-size="11.5" text-anchor="middle" fill="#002b47" font-weight="bold">Executive</text><path d="M703,100 L712,100" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M800,100 L806,100" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="756.0" y="132.0" font-size="10" text-anchor="middle" fill="#5f7482" font-style="italic">shared store</text><rect x="628.0" y="224.0" width="254.0" height="16.0" rx="4" fill="#e8edf1"/><text x="669.0" y="236.0" font-size="10" text-anchor="middle" fill="#002b47" font-weight="bold">64 %</text><circle cx="632.0" cy="196.0" r="4.5" fill="#002b47"/><path d="M632,202 L632,222" fill="none" stroke="#002b47" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)" stroke-dasharray="3 3"/><text x="755.0" y="236.0" font-size="10" text-anchor="middle" fill="#002b47" font-weight="bold">63 %</text><circle cx="710.0" cy="196.0" r="4.5" fill="#002b47"/><path d="M710,202 L710,222" fill="none" stroke="#002b47" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)" stroke-dasharray="3 3"/><text x="841.0" y="236.0" font-size="10" text-anchor="middle" fill="#002b47" font-weight="bold">61 %</text><circle cx="800.0" cy="196.0" r="4.5" fill="#002b47"/><path d="M800,202 L800,222" fill="none" stroke="#002b47" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)" stroke-dasharray="3 3"/><circle cx="750.0" cy="266.0" r="4.5" fill="#2f86b3"/><path d="M750,260 L750,242" fill="none" stroke="#2f86b3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sky)" stroke-dasharray="3 3"/><circle cx="860.0" cy="266.0" r="4.5" fill="#2f86b3"/><path d="M860,260 L860,242" fill="none" stroke="#2f86b3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-sky)" stroke-dasharray="3 3"/><text x="755.0" y="316.0" font-size="12" text-anchor="middle" fill="#2f86b3" font-weight="bold" font-style="italic">reads get the newest value</text></g></svg>
