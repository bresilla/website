<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><title>Two views of an architecture. 1, structure and style: the parts and their connections, and how connected parts talk, by message or by request and reply. 2, time and task: jobs split into planning, sequencing and control layers, each job calling jobs below</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><rect x="1.0" y="1.0" width="438.0" height="358.0" rx="14" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><circle cx="38.0" cy="40.0" r="19.0" fill="#2a7a72"/><rect x="26.0" y="34.0" width="9.0" height="12.0" rx="1.5" fill="none" stroke="#fbf6e5" stroke-width="2.2"/><rect x="41.0" y="34.0" width="9.0" height="12.0" rx="1.5" fill="none" stroke="#fbf6e5" stroke-width="2.2"/><path d="M35.0,40.0 L41.0,40.0" fill="none" stroke="#fbf6e5" stroke-width="2.20" stroke-linecap="round" stroke-linejoin="round"/><circle cx="38.0" cy="40.0" r="2.4" fill="#fbf6e5"/><text x="66.0" y="38.0" font-size="18" text-anchor="start" fill="#002b47" font-weight="bold">Structure &amp; style</text><text x="66.0" y="58.0" font-size="12" text-anchor="start" fill="#5f7482">which parts, and how they talk</text><rect x="461.0" y="1.0" width="438.0" height="358.0" rx="14" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><circle cx="498.0" cy="40.0" r="19.0" fill="#8a5a00"/><circle cx="498.0" cy="40.0" r="10.5" fill="none" stroke="#fbf6e5" stroke-width="2.2"/><path d="M498.0,33.5 L498.0,40.0 L503.0,43.0" fill="none" stroke="#fbf6e5" stroke-width="2.20" stroke-linecap="round" stroke-linejoin="round"/><text x="526.0" y="38.0" font-size="18" text-anchor="start" fill="#002b47" font-weight="bold">Time &amp; task</text><text x="526.0" y="58.0" font-size="12" text-anchor="start" fill="#5f7482">how the jobs are split into layers</text><text x="220.0" y="98.0" font-size="11" text-anchor="middle" fill="#5f7482" font-style="italic">structure: the parts and their connections</text><rect x="42.0" y="113.0" width="96.0" height="34.0" rx="9" fill="#88c9e4" stroke="#2f86b3" stroke-width="2"/><text x="90.0" y="134.3" font-size="12" text-anchor="middle" fill="#002b47" font-weight="bold" letter-spacing="0.05em">GPS</text><rect x="165.0" y="113.0" w