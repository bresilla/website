4 L300,215" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M266,232 L300,241" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="42.0" y="271.0" width="96.0" height="30.0" rx="8" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="90.0" y="290.1" font-size="11.5" text-anchor="middle" fill="#002b47">caller</text><rect x="302.0" y="271.0" width="96.0" height="30.0" rx="8" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="350.0" y="290.1" font-size="11.5" text-anchor="middle" fill="#002b47">server</text><path d="M139,280 L300,280" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M300,292 L141,292" fill="none" stroke="#004d00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-green)"/><text x="220.0" y="274.0" font-size="10.5" text-anchor="middle" fill="#002b47" font-style="italic">request</text><text x="220.0" y="306.0" font-size="10.5" text-anchor="middle" fill="#004d00" font-style="italic">wait for the reply</text><text x="220.0" y="340.0" font-size="12.5" text-anchor="middle" fill="#002b47" font-weight="bold" font-style="italic">Which parts? How do they talk?</text><rect x="480.0" y="78.0" width="400.0" height="62.0" rx="8" fill="#e3eedf"/><text x="506.0" y="94.0" font-size="10" text-anchor="start" fill="#004d00" font-weight="bold" letter-spacing="0.08em">PLANNING</text><rect x="480.0" y="148.0" width="400.0" height="62.0" rx="8" fill="#e4f2f9"/><text x="506.0" y="164.0" font-size="10" text-anchor="start" fill="#2f86b3" font-weight="bold" letter-spacing="0.08em">SEQUENCING</text><rect x="480.0" y="218.0" width="400.0" height="62.0" rx="8" fill="#eff6dc"/><text x="506.0" y="234.0" font-size="10" text-anchor="start" fill="#4a6e00" font-weight="bold" letter-spacing="0.08em">CONTROL</text><rect x="640.0" y="98.0" width="130.0" height="28.0" rx="8" fill="#ffffff" stroke="#004d00" stroke-width="1.5"/><text x="705.0" y="116.1" font-size="11.5" text-anchor="middle" fill="#004d00" font-weight="bold">Scout the field</text><rect x="547.0" y="173.0" width="102.0" height="26.0" rx="8" fill="#ffffff" stroke="#2f86b3" stroke-width="1.5"/><text x="598.0" y="189.8" font-size="10.5" text-anchor="middle" fill="#002b47" font-weight="bold">Move to start</text><path d="M705,127 L598,172" fill="none" stroke="#004d00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-green)"/><rect x="654.0" y="173.0" width="102.0" height="26.0" rx="8" fill="#ffffff" stroke="#2f86b3" stroke-width="1.5"/><text x="705.0" y="189.8" font-size="10.5" text-anchor="middle" fill="#002b47" font-weight="bold">Navigate row</text><path d="M705,127 L705,172" fill="none" stroke="#004d00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-green)"/><rect x="761.0" y="173.0" width="102.0" height="26.0" rx="8" fill="#ffffff" stroke="#2f86b3" stroke-width="1.5"/><text x="812.0" y="189.8" font-size="10.5" text-anchor="middle" fill="#002b47" font-weight="bold">Headland turn</text><path d="M705,127 L812,172" fill="none" stroke="#004d00" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-green)"/><rect x="587.0" y="245.0" width="114.0" height="26.0" rx="8" fill="#ffffff" stroke="#5d8a00" stroke-width="1.5"/><text x="644.0" y="261.8" font-size="10.5" text-anchor="middle" fill="#002b47" font-weight="bold">Follow path</text><path d="M705,200 L644,244" fill="none" stroke="#002b47" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="709.0" y="245.0" width="114.0" height="26.0" rx="8" fill="#ffffff" stroke="#5d8a00" stroke-width="1.5"/><text x="766.0" y="261.8" font-size="10.5" text-anchor="middle" fill="#002b47" font-weight="bold">Avoid obstacles</text><path d="M705,200 L766,244" fill="none" stroke="#002b47" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M494,276 L494,180" fill="none" stroke="#002b47" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="504.0" y="300.0" font-size="10.5" text-anchor="start" fill="#5f7482" font-style="italic">↑ slower, more abstract</text><text x="680.0" y="340.0" font-size="12.5" text-anchor="middle" fill="#002b47" font-weight="bold" font-style="italic">How fast must it answer? Which job serves which?</text></g></svg>
