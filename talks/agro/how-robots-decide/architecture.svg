<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"><title>Structure: GPS and distance sensor feed follow path and avoid obstacles, which feed coordinate motion and the two motors. Style: publish-subscribe, where GPS sends positions to any listener, versus call and wait, where follow path asks the route planner and waits for the reply</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><rect x="10.0" y="10.0" width="430.0" height="360.0" rx="14" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="28.0" y="37.0" font-size="13" text-anchor="start" fill="#002b47" font-weight="bold" letter-spacing="0.08em">STRUCTURE</text><text x="28.0" y="57.0" font-size="12" text-anchor="start" fill="#5f7482" font-style="italic">which parts there are, and which are connected</text><rect x="55.0" y="82.0" width="150.0" height="36.0" rx="9" fill="#88c9e4" stroke="#2f86b3" stroke-width="2"/><text x="130.0" y="104.3" font-size="12" text-anchor="middle" fill="#002b47" font-weight="bold" letter-spacing="0.05em">GPS</text><rect x="245.0" y="82.0" width="150.0" height="36.0" rx="9" fill="#88c9e4" stroke="#2f86b3" stroke-width="2"/><text x="320.0" y="104.3" font-size="12" text-anchor="middle" fill="#002b47" font-weight="bold" letter-spacing="0.05em">Distance sensor</text><rect x="55.0" y="160.0" width="150.0" height="36.0" rx="8" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="130.0" y="182.5" font-size="12.5" text-anchor="middle" fill="#002b47" font-weight="bold">Follow path</text><rect x="245.0" y="160.0" width="150.0" height="36.0" rx="8" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="320.0" y="182.5" font-size="12.5" text-anchor="middle" fill="#002b47" font-weight="bold">Avoid obstacles</text><rect x="135.0" y="238.0" width="180.0" height="36.0" rx="8" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="225.0" y="260.5" font-size="12.5" text-anchor="middle" fill="#002b47" font-weight="bold">Coordinate motion</text><rect x="55.0" y="316.0" width="150.0" height="36.0" rx="9" fill="#97c600" stroke="#5d8a00" stroke-width="2"/><text x="130.0" y="338.3" font-size="12" text-anchor="middle" fill="#002b47" font-weight="bold" letter-spacing="0.05em">Left motor</text><rect x="245.0" y="316.0" width="150.0" height="36.0" rx="9" fill="#97c600" stroke="#5d8a00" stroke-width="2"/><text x="320.0" y="338.3" font-size="12" text-anchor="middle" fill="#002b47" font-weight="bold" letter-spacing="0.05em">Right motor</text><path d="M130,119 L130,157" fill="none" stroke="#002b47" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M320,119 L320,157" fill="none" stroke="#002b47" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M150,197 L198,235" fill="none" stroke="#002b47" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M300,197 L252,235" fill="none" stroke="#002b47" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M200,275 L152,313" fill="none" stroke="#002b47" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M250,275 L298,313" fill="none" stroke="#002b47" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="325.0" y="260.0" font-size="11" text-anchor="start" fill="#5f7482" font-style="italic">← a component</text><text x="298.0" y="298.0" font-size="11" text-anchor="start" fill="#5f7482" font-style="italic">← a connection</text><rect x="460.0" y="10.0" width="430.0" height="360.0" rx="14" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="478.0" y="37.0" font-size="13" text-anchor="start" fill="#002b47" font-weight="bold" letter-spacing="0.08em">STYLE</text><text x="478.0" y="57.0" font-size="12" text-anchor="start" fill="#5f7482" font-style="italic">how connected parts talk to each other</text><text x="478.0" y="96.0" font-size="13" text-anchor="start" fill="#002b47" font-weight="bold">Publish–subscribe</text><text x="872.0" y="96.0" font-size="11.5" text-anchor="end" fill="#5f7482" font-style="italic">send and move on</text><rect x="485.0" y="129.0" width="90.0" height="34.0" rx="9" fill="#88c9e4" stroke="#2f86b3" stroke-width="2"/><text x="530.0" y="150.3" font-size="12" text-anchor="middle" fill="#002b47" font-weight="bold" letter-spacing="0.05em">GPS</text><rect x="605.0" y="131.0" width="120.0" height="30.0" rx="15" fill="#e4f2f9" stroke="#2f86b3" stroke-width="1.5"/><text x="665.0" y="150.0" font-size="11" text-anchor="middle" fill="#002b47">position · 10 Hz</text><rect x="760.0" y="109.0" width="110.0" height="30.0" rx="8" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="815.0" y="128.1" font-size="11.5" text-anchor="middle" fill="#002b47" font-weight="bold">Follow path</text><rect x="760.0" y="155.0" width="110.0" height="30.0" rx="8" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="815.0" y="174.1" font-size="11.5" text-anchor="middle" fill="#002b47" font-weight="bold">Data logger</text><path d="M576,146 L603,146" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M726,141 L758,127" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M726,151 L758,166" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="478.0" y="208.0" font-size="11" text-anchor="start" fill="#5f7482" font-style="italic">The sender does not wait and does not know who listens.</text><path d="M478,224 L872,224" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="478.0" y="252.0" font-size="13" text-anchor="start" fill="#002b47" font-weight="bold">Call and wait</text><text x="872.0" y="252.0" font-size="11.5" text-anchor="end" fill="#5f7482" font-style="italic">ask, then wait for the reply</text><rect x="480.0" y="287.0" width="120.0" height="34.0" rx="8" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="540.0" y="308.1" font-size="11.5" text-anchor="middle" fill="#002b47" font-weight="bold">Follow path</text><rect x="735.0" y="287.0" width="130.0" height="34.0" rx="9" fill="#004d00" stroke="#004d00" stroke-width="2"/><text x="800.0" y="308.1" font-size="11.5" text-anchor="middle" fill="#fbf6e5" font-weight="bold" letter-spacing="0.05em">Route planner</text><path d="M601,294 L733,294" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="667.0" y="285.0" font-size="10.5" text-anchor="middle" fill="#002b47" font-style="italic">request: path to row 5</text><path d="M733,314 L603,314" fill="none" stroke="#004d00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-green)"/><text x="667.0" y="333.0" font-size="10.5" text-anchor="middle" fill="#004d00" font-style="italic">reply: waypoints</text><text x="478.0" y="358.0" font-size="11" text-anchor="start" fill="#5f7482" font-style="italic">The caller is blocked until the reply comes back.</text></g></svg>
