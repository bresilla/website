ns-serif" fill="#002b47"><text x="20.0" y="76.0" font-size="14" text-anchor="start" fill="#002b47" font-weight="bold">robot</text><text x="20.0" y="156.0" font-size="14" text-anchor="start" fill="#002b47" font-weight="bold">world</text><rect x="120.0" y="54.0" width="22.7" height="34.0" rx="6" fill="#88c9e4"/><rect x="144.7" y="54.0" width="146.0" height="34.0" rx="6" fill="#004d00"/><text x="218.7" y="76.0" font-size="13" text-anchor="middle" fill="#fbf6e5" font-weight="bold">plan</text><rect x="292.7" y="54.0" width="565.3" height="34.0" rx="6" fill="#97c600"/><text x="576.3" y="76.0" font-size="13" text-anchor="middle" fill="#002b47" font-weight="bold">act: execute the plan, sensors ignored</text><rect x="120.0" y="134.0" width="740.0" height="34.0" rx="6" fill="#eef1f3"/><text x="218.7" y="156.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">matches the model</text><path d="M144.66666666666666,40 L144.66666666666666,184" fill="none" stroke="#2f86b3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="150.7" y="36.0" font-size="11" text-anchor="start" fill="#2f86b3" font-style="italic">world model frozen</text><path d="M366.66666666666663,96 L366.66666666666663,184" fill="none" stroke="#d98e04" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M366.66666666666663,140 l11,11 l-11,11 l-11,-11 z" fill="#d98e04"/><text x="382.7" y="156.0" font-size="12" text-anchor="start" fill="#8a5a00" font-weight="bold">person walks into row 3</text><path d="M588.6666666666666,96 L588.6666666666666,184" fill="none" stroke="#b3261e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M579.6666666666666,142 L597.6666666666666,160 M597.6666666666666,142 L579.6666666666666,160" fill="none" stroke="#b3261e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="604.7" y="156.0" font-size="12" text-anchor="start" fill="#b3261e" font-weight="bold">robot drives into row 3</text><text x="132.3" y="104.0" font-size="11" text-anchor="middle" fill="#2f86b3" font-style="italic">sense</text><text x="120.0" y="204.0" font-size="11" text-anchor="middle" fill="#5f7482">0 s</text><text x="243.3" y="204.0" font-size="11" text-anchor="middle" fill="#5f7482">10 s</text><text x="366.7" y="204.0" font-size="11" text-anchor="middle" fill="#5f7482">20 s</text><text x="490.0" y="204.0" font-size="11" text-anchor="middle" fill="#5f7482">30 s</text><text x="613.3" y="204.0" font-size="11" text-anchor="middle" fill="#5f7482">40 s</text><text x="736.7" y="204.0" font-size="11" text-anchor="middle" fill="#5f7482">50 s</text><text x="860.0" y="204.0" font-size="11" text-anchor="middle" fill="#5f7482">60 s</text><path d="M120.0,188 L860.0,188" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="490.0" y="236.0" font-size="14" text-anchor="middle" fill="#002b47" font-style="italic">The plan was made for a world that no longer exists.</text></g></svg>
