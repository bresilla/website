<svg xmlns="http://www.w3.org/2000/svg" width="900" height="284" viewBox="0 0 900 284"><title>Left: a plain sequence restarts from its first action after being halted. Right: each action guarded by a condition in a fallback, so the tree resumes</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><text x="215.0" y="22.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Plain sequence</text><text x="680.0" y="22.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Each action guarded by its goal</text><rect x="193.0" y="50.0" width="44.0" height="40.0" rx="6" fill="#ffffff" stroke="#002b47" stroke-width="2"/><text x="215.0" y="77.0" font-size="19" text-anchor="middle" fill="#002b47" font-weight="bold">→</text><path d="M215,90 L95,137" fill="none" stroke="#002b47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="45.0" y="137.0" width="100.0" height="46.0" rx="10" fill="#eff6dc" stroke="#5d8a00" stroke-width="2"/><text x="95.0" y="156.6" font-size="12" text-anchor="middle" fill="#002b47">go to</text><text x="95.0" y="172.0" font-size="12" text-anchor="middle" fill="#002b47">row start</text><path d="M215,90 L215,137" fill="none" stroke="#002b47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="165.0" y="137.0" width="100.0" height="46.0" rx="10" fill="#eff6dc" stroke="#5d8a00" stroke-width="2"/><text x="215.0" y="156.6" font-size="12" text-anchor="middle" fill="#002b47">follow</text><text x="215.0" y="172.0" font-size="12" text-anchor="middle" fill="#002b47">row</text><path d="M215,90 L335,137" fill="none" stroke="#002b47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="285.0" y="137.0" width="100.0" height="46.0" rx="10" fill="#eff6dc" stroke="#5d8a00" stroke-width="2"/><text x="335.0" y="156.6" font-size="12" text-anchor="middle" fill="#002b47">headland</text><text x="335.0" y="172.0" font-size="12" text-anchor="middle" fill="#002b47">turn</text><text x="215.0" y="222.0" font-size="12" text-anchor="middle" fill="#b3261e" font-style="italic">after a halt it starts again</text><text x="215.0" y="240.0" font-size="12" text-anchor="middle" fill="#b3261e" font-style="italic">at “go to row start”</text><path d="M445,30 L445,250" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><rect x="658.0" y="44.0" width="44.0" height="40.0" rx="6" fill="#ffffff" stroke="#002b47" stroke-width="2"/><text x="680.0" y="71.0" font-size="19" text-anchor="middle" fill="#002b47" font-weight="bold">→</text><path d="M680,84 L540,118" fill="none" stroke="#002b47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="518.0" y="118.0" width="44.0" height="40.0" rx="6" fill="#ffffff" stroke="#002b47" stroke-width="2"/><text x="540.0" y="145.0" font-size="19" text-anchor="middle" fill="#002b47" font-weight="bold">?</text><path d="M680,84 L731,118" fill="none" stroke="#002b47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="709.0" y="118.0" width="44.0" height="40.0" rx="6" fill="#ffffff" stroke="#002b47" stroke-width="2"/><text x="731.0" y="145.0" font-size="19" text-anchor="middle" fill="#002b47" font-weight="bold">?</text><path d="M680,84 L852,138" fill="none" stroke="#002b47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="810.0" y="137.0" width="84.0" height="46.0" rx="10" fill="#eff6dc" stroke="#5d8a00" stroke-width="2"/><text x="852.0" y="156.6" font-size="12" text-anchor="middle" fill="#002b47">headland</text><text x="852.0" y="172.0" font-size="12" text-anchor="middle" fill="#002b47">turn</text><path d="M540,158 L492,205" fill="none" stroke="#002b47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="492.0" cy="228.0" rx="44.0" ry="23.0" fill="#e4f2f9" stroke="#2f86b3" stroke-width="2"/><text x="492.0" y="232.3" font-size="12" text-anchor="middle" fill="#002b47">in a row?</text><path d="M540,158 L588,205" fill="none" stroke="#002b47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="544.0" y="205.0" width="88.0" height="46.0" rx="10" fill="#eff6dc" stroke="#5d8a00" stroke-width="2"/><text x="588.0" y="224.6" font-size="12" text-anchor="middle" fill="#002b47">go to</text><text x="588.0" y="240.0" font-size="12" text-anchor="middle" fill="#002b47">row start</text><path d="M731,158 L684,205" fill="none" stroke="#002b47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="684.0" cy="228.0" rx="44.0" ry="23.0" fill="#e4f2f9" stroke="#2f86b3" stroke-width="2"/><text x="684.0" y="232.3" font-size="12" text-anchor="middle" fill="#002b47">row end?</text><path d="M731,158 L778,205" fill="none" stroke="#002b47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="734.0" y="205.0" width="88.0" height="46.0" rx="10" fill="#eff6dc" stroke="#5d8a00" stroke-width="2"/><text x="778.0" y="224.6" font-size="12" text-anchor="middle" fill="#002b47">follow</text><text x="778.0" y="240.0" font-size="12" text-anchor="middle" fill="#002b47">row</text><text x="680.0" y="274.0" font-size="12" text-anchor="middle" fill="#004d00" font-style="italic">the next tick skips work that is already done</text></g></svg>
