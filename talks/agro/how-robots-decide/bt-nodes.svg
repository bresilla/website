<svg xmlns="http://www.w3.org/2000/svg" width="900" height="306" viewBox="0 0 900 306"><title>The six behaviour tree node types: sequence, fallback, parallel, decorator, condition and action</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><rect x="2.0" y="2.0" width="292.0" height="144.0" rx="12" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><rect x="34.0" y="60.0" width="44.0" height="40.0" rx="6" fill="#ffffff" stroke="#002b47" stroke-width="2"/><text x="56.0" y="87.0" font-size="19" text-anchor="middle" fill="#002b47" font-weight="bold">→</text><text x="112.0" y="32.0" font-size="10" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">CONTROL FLOW</text><text x="112.0" y="54.0" font-size="16" text-anchor="start" fill="#002b47" font-weight="bold">Sequence</text><text x="112.0" y="80.0" font-size="11.5" text-anchor="start" fill="#002b47">Ticks children left to right.</text><text x="112.0" y="98.0" font-size="11.5" text-anchor="start" fill="#002b47">Fails as soon as one fails:</text><text x="112.0" y="116.0" font-size="11.5" text-anchor="start" fill="#002b47">an ordered AND.</text><rect x="304.0" y="2.0" width="292.0" height="144.0" rx="12" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><rect x="336.0" y="60.0" width="44.0" height="40.0" rx="6" fill="#ffffff" stroke="#002b47" stroke-width="2"/><text x="358.0" y="87.0" font-size="19" text-anchor="middle" fill="#002b47" font-weight="bold">?</text><text x="414.0" y="32.0" font-size="10" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">CONTROL FLOW</text><text x="414.0" y="54.0" font-size="16" text-anchor="start" fill="#002b47" font-weight="bold">Fallback</text><text x="414.0" y="80.0" font-size="11.5" text-anchor="start" fill="#002b47">Tries children left to right.</text><text x="414.0" y="98.0" font-size="11.5" text-anchor="start" fill="#002b47">Succeeds as soon as one</text><text x="414.0" y="116.0" font-size="11.5" text-anchor="start" fill="#002b47">succeeds: an ordered OR.</text><rect x="606.0" y="2.0" width="292.0" height="144.0" rx="12" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><rect x="638.0" y="60.0" width="44.0" height="40.0" rx="6" fill="#ffffff" stroke="#002b47" stroke-width="2"/><text x="660.0" y="87.0" font-size="19" text-anchor="middle" fill="#002b47" font-weight="bold">⇉</text><text x="716.0" y="32.0" font-size="10" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">CONTROL FLOW</text><text x="716.0" y="54.0" font-size="16" text-anchor="start" fill="#002b47" font-weight="bold">Parallel</text><text x="716.0" y="80.0" font-size="11.5" text-anchor="start" fill="#002b47">Ticks all children each tick.</text><text x="716.0" y="98.0" font-size="11.5" text-anchor="start" fill="#002b47">Succeeds when enough of</text><text x="716.0" y="116.0" font-size="11.5" text-anchor="start" fill="#002b47">them succeed.</text><rect x="2.0" y="158.0" width="292.0" height="144.0" rx="12" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><path d="M26,236 L41,214 L71,214 L86,236 L71,258 L41,258 Z" fill="#ffffff" stroke="#002b47" stroke-width="2"/><text x="56.0" y="241.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">×3</text><text x="112.0" y="188.0" font-size="10" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">DECORATOR</text><text x="112.0" y="210.0" font-size="16" text-anchor="start" fill="#002b47" font-weight="bold">Decorator</text><text x="112.0" y="236.0" font-size="11.5" text-anchor="start" fill="#002b47">Wraps one child: retry,</text><text x="112.0" y="254.0" font-size="11.5" text-anchor="start" fill="#002b47">repeat, invert, time out,</text><text x="112.0" y="272.0" font-size="11.5" text-anchor="start" fill="#002b47">limit the rate.</text><rect x="304.0" y="158.0" width="292.0" height="144.0" rx="12" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><ellipse cx="358.0" cy="236.0" rx="42.0" ry="23.0" fill="#e4f2f9" stroke="#2f86b3" stroke-width="2"/><text x="358.0" y="232.6" font-size="12" text-anchor="middle" fill="#002b47">battery</text><text x="358.0" y="248.0" font-size="12" text-anchor="middle" fill="#002b47">&gt; 20 %</text><text x="414.0" y="188.0" font-size="10" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">EXECUTION</text><text x="414.0" y="210.0" font-size="16" text-anchor="start" fill="#002b47" font-weight="bold">Condition</text><text x="414.0" y="236.0" font-size="11.5" text-anchor="start" fill="#002b47">Checks something about</text><text x="414.0" y="254.0" font-size="11.5" text-anchor="start" fill="#002b47">the world. Instant SUCCESS</text><text x="414.0" y="272.0" font-size="11.5" text-anchor="start" fill="#002b47">or FAILURE, never RUNNING.</text><rect x="606.0" y="158.0" width="292.0" height="144.0" rx="12" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><rect x="618.0" y="213.0" width="84.0" height="46.0" rx="10" fill="#eff6dc" stroke="#5d8a00" stroke-width="2"/><text x="660.0" y="232.6" font-size="12" text-anchor="middle" fill="#002b47">follow</text><text x="660.0" y="248.0" font-size="12" text-anchor="middle" fill="#002b47">row</text><text x="716.0" y="188.0" font-size="10" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">EXECUTION</text><text x="716.0" y="210.0" font-size="16" text-anchor="start" fill="#002b47" font-weight="bold">Action</text><text x="716.0" y="236.0" font-size="11.5" text-anchor="start" fill="#002b47">Does something. Can return</text><text x="716.0" y="254.0" font-size="11.5" text-anchor="start" fill="#002b47">RUNNING for many ticks</text><text x="716.0" y="272.0" font-size="11.5" text-anchor="start" fill="#002b47">before it finishes.</text></g></svg>
