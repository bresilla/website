<svg xmlns="http://www.w3.org/2000/svg" width="900" height="326" viewBox="0 0 900 326"><title>Left: a pipeline of functional modules between sensors and actuators. Right: parallel task-achieving layers, each connecting sensors to actuators</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><text x="215.0" y="20.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Sense → plan → act: functional modules</text><text x="685.0" y="20.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Behaviour-based: task-achieving layers</text><rect x="6.0" y="46.0" width="40.0" height="220.0" rx="6" fill="#e8edf1"/><text x="30.0" y="156.0" font-size="13" text-anchor="middle" fill="#002b47" transform="rotate(-90 30.0 156.0)">sensors</text><path d="M47,156 L58,156" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="60.0" y="46.0" width="50.0" height="220.0" rx="6" fill="#e4f2f9" stroke="#9fb0bb" stroke-width="1"/><text x="89.0" y="156.0" font-size="13" text-anchor="middle" fill="#002b47" transform="rotate(-90 89.0 156.0)">perception</text><path d="M111,156 L122,156" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="124.0" y="46.0" width="50.0" height="220.0" rx="6" fill="#d6ebf5" stroke="#9fb0bb" stroke-width="1"/><text x="153.0" y="156.0" font-size="13" text-anchor="middle" fill="#002b47" transform="rotate(-90 153.0 156.0)">world model</text><path d="M175,156 L186,156" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="188.0" y="46.0" width="50.0" height="220.0" rx="6" fill="#e3eedf" stroke="#9fb0bb" stroke-width="1"/><text x="217.0" y="156.0" font-size="13" text-anchor="middle" fill="#002b47" transform="rotate(-90 217.0 156.0)">planning</text><path d="M239,156 L250,156" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="252.0" y="46.0" width="50.0" height="220.0" rx="6" fill="#d4e6cf" stroke="#9fb0bb" stroke-width="1"/><text x="281.0" y="156.0" font-size="13" text-anchor="middle" fill="#002b47" transform="rotate(-90 281.0 156.0)">execution</text><path d="M303,156 L314,156" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="316.0" y="46.0" width="50.0" height="220.0" rx="6" fill="#eff6dc" stroke="#9fb0bb" stroke-width="1"/><text x="345.0" y="156.0" font-size="13" text-anchor="middle" fill="#002b47" transform="rotate(-90 345.0 156.0)">motor control</text><path d="M367,156 L378,156" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="380.0" y="46.0" width="40.0" height="220.0" rx="6" fill="#e8edf1"/><text x="404.0" y="156.0" font-size="13" text-anchor="middle" fill="#002b47" transform="rotate(-90 404.0 156.0)">actuators</text><text x="215.0" y="292.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">every module waits for the one before it</text><rect x="476.0" y="46.0" width="40.0" height="220.0" rx="6" fill="#e8edf1"/><text x="500.0" y="156.0" font-size="13" text-anchor="middle" fill="#002b47" transform="rotate(-90 500.0 156.0)">sensors</text><rect x="854.0" y="46.0" width="40.0" height="220.0" rx="6" fill="#e8edf1"/><text x="878.0" y="156.0" font-size="13" text-anchor="middle" fill="#002b47" transform="rotate(-90 878.0 156.0)">actuators</text><path d="M517,67 L530,67" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="532.0" y="50.0" width="306.0" height="34.0" rx="6" fill="#e3eedf" stroke="#9fb0bb" stroke-width="1"/><text x="685.0" y="72.0" font-size="13" text-anchor="middle" fill="#002b47">manage battery</text><path d="M839,67 L852,67" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M517,110 L530,110" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="532.0" y="93.0" width="306.0" height="34.0" rx="6" fill="#e3eedf" stroke="#9fb0bb" stroke-width="1"/><text x="685.0" y="115.0" font-size="13" text-anchor="middle" fill="#002b47">scout the field</text><path d="M839,110 L852,110" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M517,153 L530,153" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="532.0" y="136.0" width="306.0" height="34.0" rx="6" fill="#e4f2f9" stroke="#9fb0bb" stroke-width="1"/><text x="685.0" y="158.0" font-size="13" text-anchor="middle" fill="#002b47">change row</text><path d="M839,153 L852,153" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M517,196 L530,196" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="532.0" y="179.0" width="306.0" height="34.0" rx="6" fill="#e4f2f9" stroke="#9fb0bb" stroke-width="1"/><text x="685.0" y="201.0" font-size="13" text-anchor="middle" fill="#002b47">follow row</text><path d="M839,196 L852,196" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M517,239 L530,239" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="532.0" y="222.0" width="306.0" height="34.0" rx="6" fill="#eff6dc" stroke="#9fb0bb" stroke-width="1"/><text x="685.0" y="244.0" font-size="13" text-anchor="middle" fill="#002b47">avoid collisions</text><path d="M839,239 L852,239" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="685.0" y="292.0" font-size="12" text-anchor="middle" fill="#5f7482" 