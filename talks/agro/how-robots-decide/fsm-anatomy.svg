<svg xmlns="http://www.w3.org/2000/svg" width="900" height="454" viewBox="0 0 900 454"><title>Anatomy of a state machine on the door example: initial state, active state, states, events and transitions</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><g transform="translate(220,0)"><path d="M154.6,92.2 Q230.0,62.0 303.6,91.4" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="230.0" y="38.3" font-size="12" text-anchor="middle" fill="#002b47" font-style="italic">Button pressed</text><path d="M367.8,154.6 Q396.0,225.0 368.6,293.6" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="432.0" y="221.6" font-size="12" text-anchor="middle" fill="#002b47" font-style="italic">Limit</text><text x="432.0" y="237.0" font-size="12" text-anchor="middle" fill="#002b47" font-style="italic">tripped</text><path d="M305.4,357.8 Q230.0,388.0 156.4,358.6" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="230.0" y="440.3" font-size="12" text-anchor="middle" fill="#002b47" font-style="italic">Button pressed</text><path d="M92.2,295.4 Q64.0,225.0 91.4,156.4" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="28.0" y="221.6" font-size="12" text-anchor="middle" fill="#002b47" font-style="italic">Limit</text><text x="28.0" y="237.0" font-size="12" text-anchor="middle" fill="#002b47" font-style="italic">tripped</text><circle cx="110.0" cy="110.0" r="55.0" fill="none" stroke="#97c600" stroke-width="5" opacity="0.8"/><circle cx="110.0" cy="110.0" r="48.0" fill="#eff6dc" stroke="#5d8a00" stroke-width="3"/><text x="110.0" y="106.1" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Door</text><text x="110.0" y="124.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">closed</text><circle cx="350.0" cy="110.0" r="48.0" fill="#ffffff" stroke="#002b47" stroke-width="2.2"/><text x="350.0" y="106.1" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Door</text><text x="350.0" y="124.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">opening</text><circle cx="350.0" cy="340.0" r="48.0" fill="#ffffff" stroke="#002b47" stroke-width="2.2"/><text x="350.0" y="336.1" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Door</text><text x="350.0" y="354.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">open</text><circle cx="110.0" cy="340.0" r="48.0" fill="#ffffff" stroke="#002b47" stroke-width="2.2"/><text x="110.0" y="336.1" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Door</text><text x="110.0" y="354.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">closing</text><circle cx="28.0" cy="30.0" r="8.0" fill="#002b47"/><path d="M35,37 L71,73" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/></g><rect x="10.0" y="10.0" width="214.0" height="52.0" rx="10" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="24.0" y="30.0" font-size="11" text-anchor="start" fill="#002b47" font-weight="bold" letter-spacing="0.08em">INITIAL STATE</text><text x="24.0" y="50.0" font-size="12" text-anchor="start" fill="#002b47">where the machine starts</text><path d="M224,34 L244,30" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="244.0" cy="30.0" r="4.0" fill="#002b47"/><rect x="10.0" y="126.0" width="214.0" height="52.0" rx="10" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="24.0" y="146.0" font-size="11" text-anchor="start" fill="#5d8a00" font-weight="bold" letter-spacing="0.08em">ACTIVE STATE</text><text x="24.0" y="166.0" font-size="12" text-anchor="start" fill="#002b47">exactly one at a time</text><path d="M224,150 L278,128" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="278.0" cy="128.0" r="4.0" fill="#5d8a00"/><rect x="10.0" y="246.0" width="214.0" height="52.0" rx="10" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="24.0" y="266.0" font-size="11" text-anchor="start" fill="#d98e04" font-weight="bold" letter-spacing="0.08em">EVENT</text><text x="24.0" y="286.0" font-size="12" text-anchor="start" fill="#002b47">a change in the situation</text><path d="M224,270 L226,225" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="226.0" cy="225.0" r="4.0" fill="#d98e04"/><rect x="676.0" y="86.0" width="214.0" height="52.0" rx="10" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="690.0" y="106.0" font-size="11" text-anchor="start" fill="#002b47" font-weight="bold" letter-spacing="0.08em">STATE</text><text x="690.0" y="126.0" font-size="12" text-anchor="start" fill="#002b47">does one well-defined thing</text><path d="M676,110 L618,110" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="618.0" cy="110.0" r="4.0" fill="#002b47"/><rect x="676.0" y="216.0" width="214.0" height="52.0" rx="10" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="690.0" y="236.0" font-size="11" text-anchor="start" fill="#2f86b3" font-weight="bold" letter-spacing="0.08em">TRANSITION</text><text x="690.0" y="256.0" font-size="12" text-anchor="start" fill="#002b47">an event moves the machine on</text><path d="M676,240 L591,262" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><circle cx="591.0" cy="262.0" r="4.0" fill="#2f86b3"/></g></svg>
