<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><title>Finite state machine of the scout: go to row start, follow row, headland turn, return to dock and charge, with labelled transitions</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><path d="M238,90 L360,90" fill="none" stroke="#002b47" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="252.8" y="68.6" width="94.4" height="16.2" rx="3" fill="#ffffff"/><text x="300.0" y="80.0" font-size="12" text-anchor="middle" fill="#002b47" font-style="italic">at row start</text><path d="M538,90 L660,90" fill="none" stroke="#002b47" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="570.8" y="68.6" width="58.4" height="16.2" rx="3" fill="#ffffff"/><text x="600.0" y="80.0" font-size="12" text-anchor="middle" fill="#002b47" font-style="italic">row end</text><path d="M700,115 C660,170 540,170 500,115" fill="none" stroke="#002b47" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="531.2" y="160.6" width="137.6" height="16.2" rx="3" fill="#ffffff"/><text x="600.0" y="172.0" font-size="12" text-anchor="middle" fill="#002b47" font-style="italic">aligned, rows left</text><path d="M760,115 C770,200 700,262 610,272" fill="none" stroke="#002b47" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="752.0" y="198.6" width="101.6" height="16.2" rx="3" fill="#ffffff"/><text x="756.0" y="210.0" font-size="12" text-anchor="start" fill="#002b47" font-style="italic">all rows done</text><path d="M440,115 C440,190 460,230 486,258" fill="none" stroke="#002b47" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="352.8" y="184.6" width="87.2" height="16.2" rx="3" fill="#ffffff"/><text x="436.0" y="196.0" font-size="12" text-anchor="end" fill="#002b47" font-style="italic">battery low</text><path d="M430,284 L290,284" fill="none" stroke="#002b47" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="334.4" y="262.6" width="51.2" height="16.2" rx="3" fill="#ffffff"/><text x="360.0" y="274.0" font-size="12" text-anchor="middle" fill="#002b47" font-style="italic">docked</text><path d="M190,259 L162,116" fill="none" stroke="#002b47" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="81.6" y="184.6" width="94.4" height="16.2" rx="3" fill="#ffffff"/><text x="172.0" y="196.0" font-size="12" text-anchor="end" fill="#002b47" font-style="italic">battery full</text><rect x="62.0" y="65.0" width="176.0" height="50.0" rx="25" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="150.0" y="95.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Go to row start</text><rect x="362.0" y="65.0" width="176.0" height="50.0" rx="25" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="450.0" y="95.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Follow row</text><rect x="662.0" y="65.0" width="176.0" height="50.0" rx="25" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="750.0" y="95.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Headland turn</text><rect x="432.0" y="259.0" width="176.0" height="50.0" rx="25" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="520.0" y="289.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Return to dock</text><rect x="112.0" y="259.0" width="176.0" height="50.0" rx="25" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="200.0" y="289.0" font-size="14" text-anchor="middle" fill="#002b47" font-weight="bold">Charge</text><circle cx="36.0" cy="90.0" r="9.0" fill="#002b47"/><path d="M45,90 L60,90" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/></g></svg>
