<svg xmlns="http://www.w3.org/2000/svg" width="900" height="356" viewBox="0 0 900 356"><title>Nav2 as a three-layer architecture: planner server for planning, BT Navigator as the executive, controller and behavior servers for behavioural control</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><rect x="10.0" y="14.0" width="880.0" height="92.0" rx="10" fill="#e3eedf"/><text x="24.0" y="32.0" font-size="11" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">PLANNING</text><rect x="10.0" y="124.0" width="880.0" height="96.0" rx="10" fill="#e4f2f9"/><text x="24.0" y="142.0" font-size="11" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">EXECUTIVE</text><rect x="10.0" y="238.0" width="880.0" height="112.0" rx="10" fill="#eff6dc"/><text x="24.0" y="256.0" font-size="11" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">BEHAVIOURAL CONTROL</text><rect x="320.0" y="32.0" width="260.0" height="56.0" rx="8" fill="#ffffff" stroke="#004d00" stroke-width="1.5"/><text x="450.0" y="56.8" font-size="14" text-anchor="middle" fill="#004d00" font-weight="bold">Planner server</text><text x="450.0" y="71.7" font-size="11" text-anchor="middle" fill="#5f7482">global path · NavFn, Smac, Theta*</text><rect x="645.0" y="38.0" width="170.0" height="44.0" rx="8" fill="#ffffff" stroke="#9fb0bb" stroke-width="1.5"/><text x="730.0" y="64.3" font-size="12" text-anchor="middle" fill="#5f7482">global costmap</text><rect x="320.0" y="144.0" width="260.0" height="56.0" rx="8" fill="#ffffff" stroke="#2f86b3" stroke-width="1.5"/><text x="450.0" y="168.8" font-size="14" text-anchor="middle" fill="#2f86b3" font-weight="bold">BT Navigator</text><text x="450.0" y="183.7" font-size="11" text-anchor="middle" fill="#5f7482">behaviour tree in XML</text><rect x="55.0" y="150.0" width="170.0" height="44.0" rx="8" fill="#ffffff" stroke="#002b47" stroke-width="1.5"/><text x="140.0" y="176.3" font-size="12" text-anchor="middle" fill="#002b47">your mission node</text><rect x="170.0" y="272.0" width="240.0" height="56.0" rx="8" fill="#ffffff" stroke="#5d8a00" stroke-width="1.5"/><text x="290.0" y="296.8" font-size="14" text-anchor="middle" fill="#4a6e00" font-weight="bold">Controller server</text><text x="290.0" y="311.7" font-size="11" text-anchor="middle" fill="#5f7482">local trajectory, ~20 Hz</text><rect x="485.0" y="272.0" width="230.0" height="56.0" rx="8" fill="#ffffff" stroke="#5d8a00" stroke-width="1.5"/><text x="600.0" y="296.8" font-size="14" text-anchor="middle" fill="#4a6e00" font-weight="bold">Behavior server</text><text x="600.0" y="311.7" font-size="11" text-anchor="middle" fill="#5f7482">spin · back up · wait</text><rect x="752.0" y="272.0" width="120.0" height="56.0" rx="8" fill="#002b47" stroke="#002b47" stroke-width="1.5"/><text x="812.0" y="304.7" font-size="13" text-anchor="middle" fill="#fbf6e5" font-weight="bold">robot base</text><path d="M580,60 L643,60" fill="none" stroke="#a9b7c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M225,172 L318,172" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="232.0" y="160.0" font-size="11" text-anchor="start" fill="#002b47" font-style="italic">NavigateToPose</text><path d="M450,144 L450,90" fill="none" stroke="#004d00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-green)"/><text x="460.0" y="122.0" font-size="11" text-anchor="start" fill="#004d00" font-style="italic">ComputePathToPose</text><path d="M400,200 L320,270" fill="none" stroke="#5d8a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-lime)"/><text x="258.0" y="228.0" font-size="11" text-anchor="start" fill="#4a6e00" font-style="italic">FollowPath</text><path d="M500,200 L575,270" fill="none" stroke="#5d8a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-lime)"/><text x="548.0" y="228.0" font-size="11" text-anchor="start" fill="#4a6e00" font-style="italic">Spin · BackUp · Wait</text><path d="M410,300 L483,300" fill="none" stroke="#a9b7c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M716,300 L750,300" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><path d="M290,330 C320,348 700,350 790,330" fill="none" stroke="#002b47" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)" stroke-dasharray="5 4"/><rect x="509.6" y="329.6" width="60.8" height="14.9" rx="3" fill="#eff6dc"/><text x="540.0" y="340.0" font-size="11" text-anchor="middle" fill="#002b47" font-style="italic">/cmd_vel</text><text x="880.0" y="30.0" font-size="10" text-anchor="end" fill="#5f7482" font-style="italic">solid: ROS 2 actions · dashed: topics and shared data</text></g></svg>
