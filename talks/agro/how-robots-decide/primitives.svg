<svg xmlns="http://www.w3.org/2000/svg" width="900" height="312" viewBox="0 0 900 312"><title>The three robot primitives: sense turns sensor data into information, plan turns information into directives, act turns them into actuator commands</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><ellipse cx="150.0" cy="40.0" rx="30.0" ry="17.0" fill="#ffffff" stroke="#2f86b3" stroke-width="3"/><circle cx="150.0" cy="40.0" r="9.0" fill="#2f86b3"/><circle cx="153.0" cy="37.0" r="3.0" fill="#ffffff"/><rect x="45.0" y="85.0" width="210.0" height="62.0" rx="9" fill="#88c9e4" stroke="#2f86b3" stroke-width="2"/><text x="150.0" y="123.9" font-size="22" text-anchor="middle" fill="#002b47" font-weight="bold" letter-spacing="0.05em">SENSE</text><text x="54.0" y="184.0" font-size="10" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">IN</text><text x="90.0" y="184.0" font-size="13" text-anchor="start" fill="#002b47">sensor data</text><text x="54.0" y="208.0" font-size="10" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">OUT</text><text x="90.0" y="208.0" font-size="13" text-anchor="start" fill="#002b47">sensed information</text><text x="150.0" y="252.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">lidar points → “person 3 m ahead”</text><path d="M420,54 C440,54 436,32 456,32 S472,44 476,36" fill="none" stroke="#004d00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 6"/><circle cx="420.0" cy="54.0" r="5.0" fill="#004d00"/><path d="M476,38 L476,14" fill="none" stroke="#004d00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M476,14 L492,19 L476,24 Z" fill="#5d8a00"/><rect x="345.0" y="85.0" width="210.0" height="62.0" rx="9" fill="#004d00" stroke="#004d00" stroke-width="2"/><text x="450.0" y="123.9" font-size="22" text-anchor="middle" fill="#fbf6e5" font-weight="bold" letter-spacing="0.05em">PLAN</text><text x="354.0" y="184.0" font-size="10" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">IN</text><text x="390.0" y="184.0" font-size="13" text-anchor="start" fill="#002b47">information</text><text x="354.0" y="208.0" font-size="10" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">OUT</text><text x="390.0" y="208.0" font-size="13" text-anchor="start" fill="#002b47">directives</text><text x="450.0" y="252.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">“rows 1–4 done” → “scout row 5”</text><circle cx="750.0" cy="40.0" r="21.0" fill="#ffffff" stroke="#5d8a00" stroke-width="5"/><circle cx="750.0" cy="40.0" r="5.0" fill="#5d8a00"/><path d="M756.0,40.0 L767.0,40.0" fill="none" stroke="#5d8a00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M753.0,45.2 L758.5,54.7" fill="none" stroke="#5d8a00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M747.0,45.2 L741.5,54.7" fill="none" stroke="#5d8a00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M744.0,40.0 L733.0,40.0" fill="none" stroke="#5d8a00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M747.0,34.8 L741.5,25.3" fill="none" stroke="#5d8a00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M753.0,34.8 L758.5,25.3" fill="none" stroke="#5d8a00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="645.0" y="85.0" width="210.0" height="62.0" rx="9" fill="#97c600" stroke="#5d8a00" stroke-width="2"/><text x="750.0" y="123.9" font-size="22" text-anchor="middle" fill="#002b47" font-weight="bold" letter-spacing="0.05em">ACT</text><text x="654.0" y="184.0" font-size="10" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">IN</text><text x="690.0" y="184.0" font-size="13" text-anchor="start" fill="#002b47">information or directives</text><text x="654.0" y="208.0" font-size="10" text-anchor="start" fill="#5f7482" font-weight="bold" letter-spacing="0.08em">OUT</text><text x="690.0" y="208.0" font-size="13" text-anchor="start" fill="#002b47">actuator commands</text><text x="750.0" y="252.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">“steer 2° left” → wheel speeds</text><path d="M258,116 L342,116" fill="none" stroke="#a9b7c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><circle cx="300.0" cy="116.0" r="15.0" fill="#ffffff" stroke="#5f7482" stroke-width="1.8"/><text x="300.0" y="121.0" font-size="15" text-anchor="middle" fill="#5f7482" font-weight="bold">?</text><path d="M558,116 L642,116" fill="none" stroke="#a9b7c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><circle cx="600.0" cy="116.0" r="15.0" fill="#ffffff" stroke="#5f7482" stroke-width="1.8"/><text x="600.0" y="121.0" font-size="15" text-anchor="middle" fill="#5f7482" font-weight="bold">?</text><text x="450.0" y="296.0" font-size="15" text-anchor="middle" fill="#002b47" font-weight="bold">A paradigm is a choice of how to connect these three.</text></g></svg>
