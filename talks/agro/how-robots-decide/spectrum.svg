<svg xmlns="http://www.w3.org/2000/svg" width="900" height="304" viewBox="0 0 900 304"><title>The deliberative to reactive spectrum with example architectures and how representation, speed, prediction and model dependence change along it</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker><linearGradient id="spec" x1="0" x2="1"><stop offset="0" stop-color="#004d00"/><stop offset="0.5" stop-color="#2f86b3"/><stop offset="1" stop-color="#97c600"/></linearGradient></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><text x="60.0" y="40.0" font-size="15" text-anchor="start" fill="#004d00" font-weight="bold" letter-spacing="0.08em">DELIBERATIVE</text><text x="840.0" y="40.0" font-size="15" text-anchor="end" fill="#5d8a00" font-weight="bold" letter-spacing="0.08em">REACTIVE</text><rect x="60.0" y="54.0" width="780.0" height="26.0" rx="13" fill="url(#spec)"/><circle cx="83.4" cy="67.0" r="7.0" fill="#ffffff" stroke="#002b47" stroke-width="2"/><path d="M83.4,76 L83.4,95" fill="none" stroke="#5f7482" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="83.4" y="108.0" font-size="12" text-anchor="start" fill="#002b47">Shakey</text><circle cx="450.0" cy="67.0" r="7.0" fill="#ffffff" stroke="#002b47" stroke-width="2"/><path d="M450.0,76 L450.0,95" fill="none" stroke="#5f7482" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="450.0" y="108.0" font-size="12" text-anchor="middle" fill="#002b47">three-layer · Nav2</text><circle cx="621.6" cy="67.0" r="7.0" fill="#ffffff" stroke="#002b47" stroke-width="2"/><path d="M621.6,76 L621.6,95" fill="none" stroke="#5f7482" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="621.6" y="108.0" font-size="12" text-anchor="middle" fill="#002b47">motor schemas</text><circle cx="730.8" cy="67.0" r="7.0" fill="#ffffff" stroke="#002b47" stroke-width="2"/><path d="M730.8,76 L730.8,95" fill="none" stroke="#5f7482" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="730.8" y="108.0" font-size="12" text-anchor="middle" fill="#002b47">subsumption</text><circle cx="828.3" cy="67.0" r="7.0" fill="#ffffff" stroke="#002b47" stroke-width="2"/><path d="M828.3,76 L828.3,115" fill="none" stroke="#5f7482" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="828.3" y="128.0" font-size="12" text-anchor="end" fill="#002b47">Braitenberg vehicle</text><path d="M200,172 L700,172" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-faint)" marker-start="url(#m-faint)"/><rect x="395.6" y="164.6" width="108.8" height="16.2" rx="3" fill="#ffffff"/><text x="450.0" y="176.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">representation</text><text x="60.0" y="176.0" font-size="13" text-anchor="start" fill="#004d00" font-weight="bold">purely symbolic</text><text x="840.0" y="176.0" font-size="13" text-anchor="end" fill="#5d8a00" font-weight="bold">reflexive</text><path d="M200,202 L700,202" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-faint)" marker-start="url(#m-faint)"/><rect x="384.8" y="194.6" width="130.4" height="16.2" rx="3" fill="#ffffff"/><text x="450.0" y="206.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">speed of response</text><text x="60.0" y="206.0" font-size="13" text-anchor="start" fill="#004d00" font-weight="bold">slow</text><text x="840.0" y="206.0" font-size="13" text-anchor="end" fill="#5d8a00" font-weight="bold">fast</text><path d="M200,232 L700,232" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-faint)" marker-start="url(#m-faint)"/><rect x="370.4" y="224.6" width="159.2" height="16.2" rx="3" fill="#ffffff"/><text x="450.0" y="236.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">predictive capability</text><text x="60.0" y="236.0" font-size="13" text-anchor="start" fill="#004d00" font-weight="bold">high</text><text x="840.0" y="236.0" font-size="13" text-anchor="end" fill="#5d8a00" font-weight="bold">low</text><path d="M200,262 L700,262" fill="none" stroke="#a9b7c0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-faint)" marker-start="url(#m-faint)"/><rect x="276.8" y="254.6" width="346.4" height="16.2" rx="3" fill="#ffffff"/><text x="450.0" y="266.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">dependence on an accurate, complete world model</text><text x="60.0" y="266.0" font-size="13" text-anchor="start" fill="#004d00" font-weight="bold">high</text><text x="840.0" y="266.0" font-size="13" text-anchor="end" fill="#5d8a00" font-weight="bold">low</text><text x="840.0" y="296.0" font-size="11" text-anchor="end" fill="#5f7482" font-style="italic">after Arkin (1998)</text></g></svg>
