<svg xmlns="http://www.w3.org/2000/svg" width="900" height="368" viewBox="0 0 900 368"><title>Loop rates of a field robot grouped into planning, sequencing and control layers on a logarithmic time axis; each layer is slower and more abstract than the one below</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><rect x="10.0" y="8.0" width="790.0" height="82.0" rx="10" fill="#e3eedf"/><text x="24.0" y="27.0" font-size="11" text-anchor="start" fill="#004d00" font-weight="bold" letter-spacing="0.08em">PLANNING · minutes to hours</text><rect x="10.0" y="98.0" width="790.0" height="82.0" rx="10" fill="#e4f2f9"/><text x="24.0" y="117.0" font-size="11" text-anchor="start" fill="#2f86b3" font-weight="bold" letter-spacing="0.08em">SEQUENCING · seconds</text><rect x="10.0" y="188.0" width="790.0" height="134.0" rx="10" fill="#eff6dc"/><text x="24.0" y="207.0" font-size="11" text-anchor="start" fill="#4a6e00" font-weight="bold" letter-spacing="0.08em">CONTROL · milliseconds</text><path d="M250.0,8 L250.0,322" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="250.0" y="340.0" font-size="12" text-anchor="middle" fill="#5f7482">1 ms</text><path d="M330.8,8 L330.8,322" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="330.8" y="340.0" font-size="12" text-anchor="middle" fill="#5f7482">10 ms</text><path d="M411.7,8 L411.7,322" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="411.7" y="340.0" font-size="12" text-anchor="middle" fill="#5f7482">100 ms</text><path d="M492.5,8 L492.5,322" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="492.5" y="340.0" font-size="12" text-anchor="middle" fill="#5f7482">1 s</text><path d="M573.4,8 L573.4,322" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="573.4" y="340.0" font-size="12" text-anchor="middle" fill="#5f7482">10 s</text><path d="M636.3,8 L636.3,322" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="636.3" y="340.0" font-size="12" text-anchor="middle" fill="#5f7482">1 min</text><path d="M717.1,8 L717.1,322" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="717.1" y="340.0" font-size="12" text-anchor="middle" fill="#5f7482">10 min</text><path d="M780.0,8 L780.0,322" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="780.0" y="340.0" font-size="12" text-anchor="middle" fill="#5f7482">1 h</text><text x="515.0" y="360.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">how often it runs (log scale)</text><text x="232.0" y="54.5" font-size="13" text-anchor="end" fill="#002b47">Battery &amp; charging</text><rect x="741.4" y="42.0" width="38.6" height="16.0" rx="8" fill="#004d00"/><text x="733.4" y="54.0" font-size="11" text-anchor="end" fill="#004d00" font-style="italic">~hourly</text><text x="232.0" y="80.5" font-size="13" text-anchor="end" fill="#002b47">Plan coverage route</text><rect x="531.1" y="68.0" width="90.9" height="16.0" rx="8" fill="#004d00"/><text x="630.0" y="80.0" font-size="11" text-anchor="start" fill="#004d00" font-style="italic">seconds of thinking</text><text x="232.0" y="144.5" font-size="13" text-anchor="end" fill="#002b47">Pick next row</text><rect x="636.3" y="132.0" width="38.6" height="16.0" rx="8" fill="#2f86b3"/><text x="628.3" y="144.0" font-size="11" text-anchor="end" fill="#2f86b3" font-style="italic">every 1–3 min</text><text x="232.0" y="170.5" font-size="13" text-anchor="end" fill="#002b47">Headland turn</text><rect x="565.5" y="158.0" width="32.2" height="16.0" rx="8" fill="#2f86b3"/><text x="605.7" y="170.0" font-size="11" text-anchor="start" fill="#2f86b3" font-style="italic">~15 s</text><text x="232.0" y="234.5" font-size="13" text-anchor="end" fill="#002b47">Follow path</text><rect x="387.3" y="222.0" width="24.3" height="16.0" rx="8" fill="#97c600"/><text x="419.7" y="234.0" font-size="11" text-anchor="start" fill="#4a6e00" font-style="italic">10–20 Hz</text><text x="232.0" y="260.5" font-size="13" text-anchor="end" fill="#002b47">Avoid obstacles</text><rect x="355.2" y="248.0" width="32.2" height="16.0" rx="8" fill="#97c600"/><text x="395.3" y="260.0" font-size="11" text-anchor="start" fill="#4a6e00" font-style="italic">20–50 Hz</text><text x="232.0" y="286.5" font-size="13" text-anchor="end" fill="#002b47">Coordinate motion</text><rect x="323.0" y="274.0" width="14.2" height="16.0" rx="8" fill="#97c600"/><text x="345.2" y="286.0" font-size="11" text-anchor="start" fill="#4a6e00" font-style="italic">100 Hz</text><text x="232.0" y="312.5" font-size="13" text-anchor="end" fill="#002b47">Motor current</text><rect x="250.0" y="300.0" width="16.5" height="16.0" rx="8" fill="#97c600"/><text x="274.5" y="312.0" font-size="11" text-anchor="start" fill="#4a6e00" font-style="italic">1 kHz</text><rect x="470.0" y="250.0" width="234.8" height="14.2" rx="3" fill="#fbe7bd"/><text x="474.0" y="260.0" font-size="10.5" text-anchor="start" fill="#8a5a00" font-style="italic">100 ms late = 10 cm further at 1 m/s</text><path d="M845,316 L845,16" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="830.0" y="165.0" font-size="12" text-anchor="middle" fill="#002b47" font-weight="bold" transform="rotate(-90 830.0 165.0)">slower · more abstract</text><text x="870.0" y="165.0" font-size="11" text-anchor="middle" fill="#5f7482" font-style="italic" transform="rotate(-90 870.0 165.0)">each layer ≈ 10× slower</text></g></svg>
