<svg xmlns="http://www.w3.org/2000/svg" width="900" height="392" viewBox="0 0 900 392"><title>Three-layer architecture: deliberator, sequencer and controller with their time scales and state, commands flowing down and failures flowing up</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><text x="75.0" y="22.0" font-size="11" text-anchor="middle" fill="#5f7482" font-style="italic">time scale</text><text x="830.0" y="22.0" font-size="11" text-anchor="middle" fill="#5f7482" font-style="italic">state it keeps</text><rect x="150.0" y="36.0" width="600.0" height="82.0" rx="10" fill="#e3eedf" stroke="#004d00" stroke-width="1.8"/><text x="172.0" y="66.0" font-size="17" text-anchor="start" fill="#004d00" font-weight="bold">Deliberator</text><text x="172.0" y="88.0" font-size="13" text-anchor="start" fill="#002b47">Plans ahead: coverage route, charging stops</text><text x="172.0" y="106.0" font-size="13" text-anchor="start" fill="#002b47">Answers when the sequencer asks for a plan</text><text x="75.0" y="82.0" font-size="15" text-anchor="middle" fill="#004d00" font-weight="bold">minutes</text><text x="830.0" y="73.6" font-size="12" text-anchor="middle" fill="#002b47">world model</text><text x="830.0" y="89.0" font-size="12" text-anchor="middle" fill="#002b47">map, energy model</text><rect x="150.0" y="146.0" width="600.0" height="82.0" rx="10" fill="#e4f2f9" stroke="#2f86b3" stroke-width="1.8"/><text x="172.0" y="176.0" font-size="17" text-anchor="start" fill="#2f86b3" font-weight="bold">Sequencer</text><text x="172.0" y="198.0" font-size="13" text-anchor="start" fill="#002b47">Chooses the skill that runs now</text><text x="172.0" y="216.0" font-size="13" text-anchor="start" fill="#002b47">Follows the plan, handles failures</text><text x="75.0" y="192.0" font-size="15" text-anchor="middle" fill="#2f86b3" font-weight="bold">seconds</text><text x="830.0" y="183.6" font-size="12" text-anchor="middle" fill="#002b47">what has happened</text><text x="830.0" y="199.0" font-size="12" text-anchor="middle" fill="#002b47">rows done, last error</text><rect x="150.0" y="256.0" width="600.0" height="82.0" rx="10" fill="#eff6dc" stroke="#5d8a00" stroke-width="1.8"/><text x="172.0" y="286.0" font-size="17" text-anchor="start" fill="#4a6e00" font-weight="bold">Controller</text><text x="172.0" y="308.0" font-size="13" text-anchor="start" fill="#002b47">Skills: follow row, turn, avoid, dock</text><text x="172.0" y="326.0" font-size="13" text-anchor="start" fill="#002b47">Tight sensor-to-actuator loops</text><text x="75.0" y="302.0" font-size="15" text-anchor="middle" fill="#5d8a00" font-weight="bold">milliseconds</text><text x="830.0" y="301.3" font-size="12" text-anchor="middle" fill="#002b47">little or none</text><path d="M300,119 L300,144" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="310.0" y="136.0" font-size="11" text-anchor="start" fill="#002b47" font-style="italic">plan</text><path d="M300,229 L300,254" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="310.0" y="246.0" font-size="11" text-anchor="start" fill="#002b47" font-style="italic">start skill + parameters</text><path d="M600,144 L600,119" fill="none" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-red)"/><text x="610.0" y="136.0" font-size="11" text-anchor="start" fill="#b3261e" font-style="italic">need a new plan</text><path d="M600,254 L600,229" fill="none" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-red)"/><text x="610.0" y="246.0" font-size="11" text-anchor="start" fill="#b3261e" font-style="italic">success / failure</text><rect x="150.0" y="362.0" width="600.0" height="24.0" rx="6" fill="#002b47"/><text x="450.0" y="379.0" font-size="12" text-anchor="middle" fill="#fbf6e5" font-weight="bold">sensors and actuators</text><path d="M450,339 L450,360" fill="none" stroke="#002b47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)" marker-start="url(#m-navy)"/></g></svg>
