<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372"><title>Loop periods of the scout robot on a logarithmic time axis, from motor control at 1 kHz to hourly battery planning</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><path d="M270.0,44 L270.0,318" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="270.0" y="338.0" font-size="12" text-anchor="middle" fill="#5f7482">1 ms</text><path d="M363.0,44 L363.0,318" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="363.0" y="338.0" font-size="12" text-anchor="middle" fill="#5f7482">10 ms</text><path d="M456.1,44 L456.1,318" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="456.1" y="338.0" font-size="12" text-anchor="middle" fill="#5f7482">100 ms</text><path d="M549.1,44 L549.1,318" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="549.1" y="338.0" font-size="12" text-anchor="middle" fill="#5f7482">1 s</text><path d="M642.2,44 L642.2,318" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="642.2" y="338.0" font-size="12" text-anchor="middle" fill="#5f7482">10 s</text><path d="M714.6,44 L714.6,318" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="714.6" y="338.0" font-size="12" text-anchor="middle" fill="#5f7482">1 min</text><path d="M807.6,44 L807.6,318" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="807.6" y="338.0" font-size="12" text-anchor="middle" fill="#5f7482">10 min</text><path d="M880.0,44 L880.0,318" fill="none" stroke="#a9b7c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="880.0" y="338.0" font-size="12" text-anchor="middle" fill="#5f7482">1 h</text><path d="M270,318 L880,318" fill="none" stroke="#5f7482" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="575.0" y="362.0" font-size="12" text-anchor="middle" fill="#5f7482" font-style="italic">period of the loop (log scale)</text><text x="250.0" y="68.5" font-size="13" text-anchor="end" fill="#002b47">Motor current loop</text><rect x="270.0" y="55.0" width="19.0" height="18.0" rx="9" fill="#97c600"/><text x="297.0" y="68.0" font-size="11" text-anchor="start" fill="#5d8a00" font-style="italic">1 kHz</text><text x="250.0" y="101.5" font-size="13" text-anchor="end" fill="#002b47">Wheel speed PID</text><rect x="354.0" y="88.0" width="16.4" height="18.0" rx="9" fill="#97c600"/><text x="378.4" y="101.0" font-size="11" text-anchor="start" fill="#5d8a00" font-style="italic">100 Hz</text><text x="250.0" y="134.5" font-size="13" text-anchor="end" fill="#002b47">Halt if too close</text><rect x="391.0" y="121.0" width="37.0" height="18.0" rx="9" fill="#97c600"/><text x="436.1" y="134.0" font-size="11" text-anchor="start" fill="#5d8a00" font-style="italic">20–50 Hz</text><text x="250.0" y="167.5" font-size="13" text-anchor="end" fill="#002b47">Row following</text><rect x="428.1" y="154.0" width="28.0" height="18.0" rx="9" fill="#97c600"/><text x="464.1" y="167.0" font-size="11" text-anchor="start" fill="#5d8a00" font-style="italic">10–20 Hz</text><text x="250.0" y="200.5" font-size="13" text-anchor="end" fill="#002b47">Headland turn</text><rect x="633.1" y="187.0" width="37.0" height="18.0" rx="9" fill="#88c9e4"/><text x="678.2" y="200.0" font-size="11" text-anchor="start" fill="#2f86b3" font-style="italic">~15 s</text><text x="250.0" y="233.5" font-size="13" text-anchor="end" fill="#002b47">Next-row decision</text><rect x="714.6" y="220.0" width="44.4" height="18.0" rx="9" fill="#88c9e4"/><text x="767.0" y="233.0" font-size="11" text-anchor="start" fill="#2f86b3" font-style="italic">every 1–3 min</text><text x="250.0" y="266.5" font-size="13" text-anchor="end" fill="#002b47">Coverage route planning</text><rect x="593.5" y="253.0" width="104.7" height="18.0" rx="9" fill="#004d00"/><text x="706.2" y="266.0" font-size="11" text-anchor="start" fill="#004d00" font-style="italic">seconds of compute</text><text x="250.0" y="299.5" font-size="13" text-anchor="end" fill="#002b47">Battery &amp; charging schedule</text><rect x="835.6" y="286.0" width="44.4" height="18.0" rx="9" fill="#004d00"/><text x="827.6" y="299.0" font-size="11" text-anchor="end" fill="#004d00" font-style="italic">~hourly</text><rect x="270.0" y="14.0" width="26.0" height="12.0" rx="6" fill="#97c600"/><text x="304.0" y="25.0" font-size="12" text-anchor="start" fill="#002b47">controller</text><rect x="420.0" y="14.0" width="26.0" height="12.0" rx="6" fill="#88c9e4"/><text x="454.0" y="25.0" font-size="12" text-anchor="start" fill="#002b47">sequencer</text><rect x="570.0" y="14.0" width="26.0" height="12.0" rx="6" fill="#004d00"/><text x="604.0" y="25.0" font-size="12" text-anchor="start" fill="#002b47">deliberator</text></g></svg>
