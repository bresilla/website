<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><title>Left: all jobs of a field robot in one loop, so each cycle lasts as long as the 12 s route planner. Right: the jobs split by time into planning, sequencing and control, and by task into a tree of jobs that call each other</title><defs><marker id="m-navy" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#002b47"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#004d00"/></marker><marker id="m-lime" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5d8a00"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3261e"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d98e04"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5f7482"/></marker><marker id="m-sky" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f86b3"/></marker><marker id="m-cream" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fbf6e5"/></marker><marker id="m-limeb" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#97c600"/></marker><marker id="m-faint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a9b7c0"/></marker></defs><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" fill="#002b47"><rect x="10.0" y="10.0" width="370.0" height="320.0" rx="14" fill="#e8edf1"/><text x="28.0" y="36.0" font-size="12" text-anchor="start" fill="#002b47" font-weight="bold" letter-spacing="0.08em">ONE BIG LOOP</text><rect x="28.0" y="52.0" width="300.0" height="24.0" rx="6" fill="#ffffff" stroke="#b3261e" stroke-width="1.8"/><text x="40.0" y="68.5" font-size="12.5" text-anchor="start" fill="#002b47">Plan coverage route</text><text x="316.0" y="68.5" font-size="11.5" text-anchor="end" fill="#b3261e" font-weight="bold" font-style="italic">12 s</text><rect x="28.0" y="81.0" width="300.0" height="24.0" rx="6" fill="#ffffff" stroke="#d3dce2" stroke-width="1.2"/><text x="40.0" y="97.5" font-size="12.5" text-anchor="start" fill="#002b47">Motor current</text><text x="316.0" y="97.5" font-size="11.5" text-anchor="end" fill="#5f7482" font-style="italic">1 kHz</text><rect x="28.0" y="110.0" width="300.0" height="24.0" rx="6" fill="#ffffff" stroke="#d3dce2" stroke-width="1.2"/><text x="40.0" y="126.5" font-size="12.5" text-anchor="start" fill="#002b47">Pick next row</text><text x="316.0" y="126.5" font-size="11.5" text-anchor="end" fill="#5f7482" font-style="italic">1–3 min</text><rect x="28.0" y="139.0" width="300.0" height="24.0" rx="6" fill="#ffffff" stroke="#d3dce2" stroke-width="1.2"/><text x="40.0" y="155.5" font-size="12.5" text-anchor="start" fill="#002b47">Avoid obstacles</text><text x="316.0" y="155.5" font-size="11.5" text-anchor="end" fill="#5f7482" font-style="italic">20–50 Hz</text><rect x="28.0" y="168.0" width="300.0" height="24.0" rx="6" fill="#ffffff" stroke="#d3dce2" stroke-width="1.2"/><text x="40.0" y="184.5" font-size="12.5" text-anchor="start" fill="#002b47">Battery &amp; charging</text><text x="316.0" y="184.5" font-size="11.5" text-anchor="end" fill="#5f7482" font-style="italic">hourly</text><rect x="28.0" y="197.0" width="300.0" height="24.0" rx="6" fill="#ffffff" stroke="#d3dce2" stroke-width="1.2"/><text x="40.0" y="213.5" font-size="12.5" text-anchor="start" fill="#002b47">Follow path</text><text x="316.0" y="213.5" font-size="11.5" text-anchor="end" fill="#5f7482" font-style="italic">10–20 Hz</text><rect x="28.0" y="226.0" width="300.0" height="24.0" rx="6" fill="#ffffff" stroke="#d3dce2" stroke-width="1.2"/><text x="40.0" y="242.5" font-size="12.5" text-anchor="start" fill="#002b47">Headland turn</text><text x="316.0" y="242.5" font-size="11.5" text-anchor="end" fill="#5f7482" font-style="italic">~15 s</text><rect x="28.0" y="255.0" width="300.0" height="24.0" rx="6" fill="#ffffff" stroke="#d3dce2" stroke-width="1.2"/><text x="40.0" y="271.5" font-size="12.5" text-anchor="start" fill="#002b47">Coordinate motion</text><text x="316.0" y="271.5" font-size="11.5" text-anchor="end" fill="#5f7482" font-style="italic">100 Hz</text><path d="M332,267 C362,267 362,64 332,64" fill="none" stroke="#002b47" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="368.0" y="166.0" font-size="11" text-anchor="middle" fill="#5f7482" font-style="italic" transform="rotate(90 368.0 166.0)">every cycle</text><text x="195.0" y="298.8" font-size="11.5" text-anchor="middle" fill="#b3261e" font-style="italic">One cycle lasts as long as the slowest job:</text><text x="195.0" y="313.5" font-size="11.5" text-anchor="middle" fill="#b3261e" font-style="italic">motor control gets a turn only every 12 s</text><path d="M390,170 L462,170" fill="none" stroke="#002b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><text x="426.0" y="158.0" font-size="13" text-anchor="middle" fill="#002b47" font-weight="bold">split</text><rect x="475.0" y="10.0" width="415.0" height="152.0" rx="14" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="493.0" y="37.0" font-size="13" text-anchor="start" fill="#002b47" font-weight="bold" letter-spacing="0.08em">BY TIME</text><text x="580.0" y="37.0" font-size="12" text-anchor="start" fill="#5f7482" font-style="italic">how often must it answer?</text><text x="585.0" y="70.0" font-size="12" text-anchor="end" fill="#004d00" font-weight="bold">planning</text><rect x="598.0" y="60.0" width="272.0" height="12.0" rx="6" fill="#e8edf1"/><rect x="790.0" y="59.0" width="76.0" height="14.0" rx="7" fill="#004d00"/><text x="585.0" y="100.0" font-size="12" text-anchor="end" fill="#2f86b3" font-weight="bold">sequencing</text><rect x="598.0" y="90.0" width="272.0" height="12.0" rx="6" fill="#e8edf1"/><rect x="700.0" y="89.0" width="52.0" height="14.0" rx="7" fill="#2f86b3"/><text x="585.0" y="130.0" font-size="12" text-anchor="end" fill="#4a6e00" font-weight="bold">control</text><rect x="598.0" y="120.0" width="272.0" height="12.0" rx="6" fill="#e8edf1"/><rect x="600.0" y="119.0" width="40.0" height="14.0" rx="7" fill="#97c600"/><text x="620.0" y="152.0" font-size="10.5" text-anchor="middle" fill="#5f7482">milliseconds</text><text x="726.0" y="152.0" font-size="10.5" text-anchor="middle" fill="#5f7482">seconds</text><text x="828.0" y="152.0" font-size="10.5" text-anchor="middle" fill="#5f7482">minutes – hours</text><rect x="475.0" y="172.0" width="415.0" height="158.0" rx="14" fill="#ffffff" stroke="#d3dce2" stroke-width="1.5"/><text x="493.0" y="199.0" font-size="13" text-anchor="start" fill="#002b47" font-weight="bold" letter-spacing="0.08em">BY TASK</text><text x="580.0" y="199.0" font-size="12" text-anchor="start" fill="#5f7482" font-style="italic">which job serves which?</text><rect x="612.0" y="214.0" width="140.0" height="24.0" rx="8" fill="#ffffff" stroke="#004d00" stroke-width="1.5"/><text x="682.0" y="230.1" font-size="11.5" text-anchor="middle" fill="#004d00" font-weight="bold">Scout the field</text><rect x="518.0" y="256.0" width="104.0" height="24.0" rx="8" fill="#ffffff" stroke="#2f86b3" stroke-width="1.5"/><text x="570.0" y="272.0" font-size="11" text-anchor="middle" fill="#002b47" font-weight="bold">Move to start</text><path d="M682,239 L570,255" fill="none" stroke="#004d00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-green)"/><rect x="630.0" y="256.0" width="104.0" height="24.0" rx="8" fill="#ffffff" stroke="#2f86b3" stroke-width="1.5"/><text x="682.0" y="272.0" font-size="11" text-anchor="middle" fill="#002b47" font-weight="bold">Navigate row</text><path d="M682,239 L682,255" fill="none" stroke="#004d00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-green)"/><rect x="742.0" y="256.0" width="104.0" height="24.0" rx="8" fill="#ffffff" stroke="#2f86b3" stroke-width="1.5"/><text x="794.0" y="272.0" font-size="11" text-anchor="middle" fill="#002b47" font-weight="bold">Headland turn</text><path d="M682,239 L794,255" fill="none" stroke="#004d00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-green)"/><rect x="559.0" y="298.0" width="118.0" height="24.0" rx="8" fill="#ffffff" stroke="#5d8a00" stroke-width="1.5"/><text x="618.0" y="314.0" font-size="11" text-anchor="middle" fill="#002b47" font-weight="bold">Follow path</text><path d="M682,281 L618,297" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/><rect x="687.0" y="298.0" width="118.0" height="24.0" rx="8" fill="#ffffff" stroke="#5d8a00" stroke-width="1.5"/><text x="746.0" y="314.0" font-size="11" text-anchor="middle" fill="#002b47" font-weight="bold">Avoid obstacles</text><path d="M682,281 L746,297" fill="none" stroke="#002b47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-navy)"/></g></svg>
